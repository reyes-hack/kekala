<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada | KEKALA</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0f1e;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Fondo animado */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 20%, rgba(30, 79, 153, 0.25) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 60%);
      animation: bgPulse 8s ease-in-out infinite alternate;
      z-index: 0;
    }

    @keyframes bgPulse {
      from { opacity: 0.6; }
      to   { opacity: 1; }
    }

    /* Partículas flotantes */
    .particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      animation: float linear infinite;
    }

    @keyframes float {
      0%   { transform: translateY(110vh) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* Contenido */
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 48px 32px;
      max-width: 560px;
      width: 100%;
    }

    .logo-wrap {
      margin-bottom: 32px;
    }

    .logo-wrap img {
      height: 72px;
      filter: drop-shadow(0 0 24px rgba(30, 79, 153, 0.6));
      animation: logoGlow 3s ease-in-out infinite alternate;
    }

    @keyframes logoGlow {
      from { filter: drop-shadow(0 0 16px rgba(30, 79, 153, 0.4)); }
      to   { filter: drop-shadow(0 0 36px rgba(139, 92, 246, 0.6)); }
    }

    .error-code {
      font-size: clamp(7rem, 20vw, 10rem);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #1e4f99 0%, #8b5cf6 50%, #1e4f99 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradientShift 4s ease infinite;
      letter-spacing: -4px;
      margin-bottom: 8px;
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, #1e4f99, #8b5cf6);
      border-radius: 999px;
      margin: 20px auto 24px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 12px;
    }

    p {
      font-size: 1rem;
      color: #94a3b8;
      line-height: 1.7;
      margin-bottom: 40px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 32px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.25s ease;
      border: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #1e4f99, #2563eb);
      color: #fff;
      box-shadow: 0 8px 24px rgba(30, 79, 153, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(30, 79, 153, 0.6);
    }

    .btn svg {
      width: 20px; height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>

  <!-- Partículas flotantes -->
  <div class="particles" id="particles"></div>

  <div class="container">
    <div class="logo-wrap">
      <img src="/logo.png" alt="KEKALA Logo" onerror="this.style.display='none'" />
    </div>

    <div class="error-code">404</div>
    <div class="divider"></div>

    <h1>Página no encontrada</h1>
    <p>Lo sentimos, la página que buscas no existe o fue movida.<br/>Regresa al inicio para continuar trabajando.</p>

    <a href="/" class="btn btn-primary">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Volver al Inicio
    </a>
  </div>

  <script>
    // Generar partículas flotantes
    const container = document.getElementById('particles');
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('div');
      p.classList.add('particle');
      const size = Math.random() * 60 + 20;
      p.style.width  = size + 'px';
      p.style.height = size + 'px';
      p.style.left   = Math.random() * 100 + '%';
      p.style.animationDuration = (Math.random() * 18 + 12) + 's';
      p.style.animationDelay   = (Math.random() * -20) + 's';
      container.appendChild(p);
    }
  </script>
</body>
</html>
